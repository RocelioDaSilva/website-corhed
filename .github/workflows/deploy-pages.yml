name: Deploy CORHED to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use GitHub Actions as the Pages source
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.updatePages({
              owner: context.repo.owner,
              repo: context.repo.repo,
              build_type: 'workflow'
            })

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Assemble static site
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          cp -R assets corhed template _site/
          mkdir -p _site/template/assets
          cp -R assets/. _site/template/assets/
          test -s _site/index.html
          test -s _site/corhed/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
